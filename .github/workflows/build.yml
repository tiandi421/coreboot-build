name: Build Coreboot With Custom Bootsplash Logo

# 触发条件：push到main分支、手动点击运行
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 【关键】支持网页手动一键启动编译！

jobs:
  build-coreboot:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout 【轻量化拉取你的仓库】(logo+配置文件)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆，轻量化

      - name: 安装Coreboot编译全部依赖
        run: |
          sudo apt update
          sudo apt install -y git make gcc g++ flex bison curl libncurses-dev iasl m4 python3 python3-dev python3-pip libssl-dev

      - name: 浅克隆官方coreboot源码（轻量化，不下载完整历史）
        run: |
          git clone --depth=1 https://github.com/coreboot/coreboot.git
          cd coreboot
          # 同步下载子模块（必须）
          git submodule update --init --depth=1

      - name: 将自定义Logo复制到coreboot源码内
        run: |
          mkdir -p coreboot/assets
          cp ./assets/bootsplash.jpg coreboot/assets/bootsplash.jpg

      - name: 导入你的主板编译配置 target.config
        run: |
          cp ./configs/target.config coreboot/.config

      - name: 开始编译coreboot
        working-directory: ./coreboot
        run: |
          make -j$(nproc)

      - name: 上传编译成品 coreboot.rom
        uses: actions/upload-artifact@v4
        with:
          name: coreboot-firmware
          path: coreboot/build/coreboot.rom
          retention-days: 30 # 文件保留30天
